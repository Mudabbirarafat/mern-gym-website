name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # MERN repos often keep client/ and server/ packages instead of a root
      # one, so every package.json found (max depth 2) is built in turn.
      - name: Install and build each package
        run: |
          found=0
          for pkg in package.json */package.json; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")
            [ "$dir" = "node_modules" ] && continue
            found=1
            echo "=== $dir"
            cd "$dir"
            if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
            npm run lint --if-present || echo "::warning::$dir lint reported issues"
            npm test --if-present || echo "::warning::$dir tests failed or none exist"
            npm run build --if-present
            cd - >/dev/null
          done
          [ "$found" = 1 ] || echo "::notice::no package.json found"
